<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#365314" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" fill="url(#bgGrad)" />
  <circle cx="300" cy="380" r="320" fill="url(#glow)" />

  <!-- Geometric Architectural Frame Accents -->
  <rect x="24" y="24" width="552" height="852" rx="16" fill="none" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.3" />
  <rect x="34" y="34" width="532" height="832" rx="12" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />

  <!-- Top Badges -->
  <rect x="44" y="44" width="64" height="28" rx="6" fill="#000000" fill-opacity="0.6" stroke="#84cc16" stroke-width="1" />
  <text x="76" y="63" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UA</text>

  <rect x="466" y="44" width="90" height="28" rx="6" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1" />
  <text x="511" y="63" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">8.7 ★</text>

  <!-- Central Visual Symbol & Motif -->
  <circle cx="300" cy="380" r="160" fill="#000000" fill-opacity="0.4" stroke="#84cc16" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="300" cy="380" r="120" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  <text x="300" y="420" font-size="96" text-anchor="middle">🎖️</text>

  <!-- Vignette Overlay -->
  <rect width="600" height="900" fill="url(#vignette)" />

  <!-- Lower Branding & Typography -->
  <text x="300" y="660" fill="#84cc16" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" letter-spacing="4" text-anchor="middle">SIVAKARTHIKEYAN • SAI PALLAVI</text>
  
  <text x="300" y="730" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" letter-spacing="2" text-anchor="middle">AMARAN</text>
  
  <text x="300" y="765" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">VALOUR IN EVERY BREATH</text>
  
  <line x1="160" y1="785" x2="440" y2="785" stroke="#84cc16" stroke-width="1.5" stroke-opacity="0.6" />

  <text x="300" y="810" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">ACTION • BIOGRAPHY • WAR</text>

  <text x="300" y="835" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" letter-spacing="1" text-anchor="middle">A Rajkumar Periasamy Film</text>

  <!-- CineVerse AI Badge Footer -->
  <rect x="220" y="855" width="160" height="20" rx="4" fill="#000000" fill-opacity="0.7" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2" />
  <text x="300" y="869" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="9" font-weight="bold" letter-spacing="1" text-anchor="middle">TAMIL • CINEVERSE AI</text>
</svg>